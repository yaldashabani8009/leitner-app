name: CI

# Quality gate for branches and pull requests (a red X means: don't merge).
# main is checked by deploy.yml, which also publishes the site.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run coverage
      - run: npm run build

  # Roadmap 7.14 (ADR-017): the built app in WebKit (iPhone Safari) and Chromium (Android).
  e2e:
    runs-on: ubuntu-24.04
    env:
      # Public by design (ADR-010). The test build never calls Supabase, but the app loads its client.
      VITE_SUPABASE_URL: https://lkyqktrpwhzsfkgaqiuo.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X7Np21Bccrdw8UZIFDjtHw_8qn1zhq4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
