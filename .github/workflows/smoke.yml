name: Live smoke check

# Roadmap step 8: the published site is installable and opens offline.
# Read-only (never signs in). Runs after every deploy, by hand, and on PRs that change it.
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths: [smoke/**, playwright.live.config.ts, .github/workflows/smoke.yml]

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test -c playwright.live.config.ts
