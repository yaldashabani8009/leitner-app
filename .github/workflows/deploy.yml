name: Deploy to GitHub Pages

# Every push to main: run all checks, build, publish to
# https://yaldashabani8009.github.io/leitner-app/  (ADR-011)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public by design: the publishable key is safe in the browser because RLS is on (ADR-010).
      VITE_SUPABASE_URL: https://lkyqktrpwhzsfkgaqiuo.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X7Np21Bccrdw8UZIFDjtHw_8qn1zhq4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # SPA fallback: GitHub Pages serves 404.html for unknown paths.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
